spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eventflow}
spring.datasource.username=${DB_USERNAME:eventflow}
spring.datasource.password=${DB_PASSWORD:eventflow}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${JWT_SECRET:eventflow-local-development-secret-change-me-123456}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}