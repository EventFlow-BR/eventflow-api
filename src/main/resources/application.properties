spring.application.name=eventflow-api

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.auth.cookie-name=eventflow_token
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

app.registration.reservation-timeout-minutes=${REGISTRATION_RESERVATION_TIMEOUT_MINUTES:15}

app.registration.expiration-check-interval-ms=${REGISTRATION_EXPIRATION_CHECK_INTERVAL_MS:60000}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s

spring.rabbitmq.listener.simple.default-requeue-rejected=false